name: Build macOS DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned Apple Silicon DMG
        run: bash scripts/build-macos.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGroupManager-v1.2-macos-arm64-unsigned
          path: build/WeChatGroupManager-v1.2.dmg
          if-no-files-found: error
